name: RanchOSLivestock
options:
  bundleIdPrefix: ai.openclaw.ranchos
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "ZYJVHJWT3P"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

schemes:
  RanchOSLivestock:
    shared: true
    build:
      targets:
        RanchOSLivestock: all
        RanchOSLivestockTests: [test]
    test:
      targets:
        - RanchOSLivestockTests

targets:
  RanchOSLivestock:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.livestock.dev
        PRODUCT_NAME: RanchOSLivestock
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "ZYJVHJWT3P"
  RanchOSLivestockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: RanchOSLivestock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.livestock.dev.tests
        GENERATE_INFOPLIST_FILE: YES
