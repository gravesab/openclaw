name: RanchOSLivestock
options:
  bundleIdPrefix: ai.openclaw.ranchos
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "ZYJVHJWT3P"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

schemes:
  RanchOSLivestock:
    shared: true
    build:
      targets:
        RanchOSLivestock: all
        RanchOSLivestockTests: [test]
    test:
      targets:
        - RanchOSLivestockTests
  RanchOSLivestockiOS:
    shared: true
    build:
      targets:
        RanchOSLivestockiOS: all
  RanchOSLivestockProd:
    shared: true
    build:
      targets:
        RanchOSLivestockProd: all
  RanchOSLivestockiOSProd:
    shared: true
    build:
      targets:
        RanchOSLivestockiOSProd: all

targets:
  RanchOSLivestock:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info-iOS.plist
          - Info-Prod.plist
          - Info-iOS-Prod.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Livestock DEV
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LivestockEnvironment: DEV
        NSMicrophoneUsageDescription: Livestock DEV uses the microphone so you can dictate into text fields. Speech stays on this device.
        NSSpeechRecognitionUsageDescription: Livestock DEV converts speech to text on this device for text fields.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.livestock.dev
        PRODUCT_NAME: RanchOSLivestock
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "ZYJVHJWT3P"
  RanchOSLivestockProd:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Info-iOS.plist
          - Info-iOS-Prod.plist
    info:
      path: Sources/Info-Prod.plist
      properties:
        CFBundleDisplayName: Livestock
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LivestockEnvironment: PROD
        NSMicrophoneUsageDescription: Livestock uses the microphone so you can dictate into text fields. Speech stays on this device.
        NSSpeechRecognitionUsageDescription: Livestock converts speech to text on this device for text fields.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.livestock
        PRODUCT_NAME: Livestock
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "ZYJVHJWT3P"
  RanchOSLivestockiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Info-Prod.plist
          - Info-iOS-Prod.plist
    info:
      path: Sources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Livestock DEV
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LivestockEnvironment: DEV
        NSLocalNetworkUsageDescription: Livestock DEV reads and saves animals on this Mac.
        NSCameraUsageDescription: Livestock DEV reads barcodes and product names on the package. That reading stays on this device.
        NSMicrophoneUsageDescription: Livestock DEV uses the microphone so you can dictate into text fields. Speech stays on this device.
        NSSpeechRecognitionUsageDescription: Livestock DEV converts speech to text on this device for text fields.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.livestock.ios.dev
        PRODUCT_NAME: RanchOSLivestock
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "ZYJVHJWT3P"
        SUPPORTS_MACCATALYST: NO
  RanchOSLivestockiOSProd:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Info-Prod.plist
          - Info-iOS.plist
    info:
      path: Sources/Info-iOS-Prod.plist
      properties:
        CFBundleDisplayName: Livestock
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LivestockEnvironment: PROD
        NSLocalNetworkUsageDescription: Livestock reads and saves animals on this Mac.
        NSCameraUsageDescription: Livestock reads barcodes and product names on the package. That reading stays on this device.
        NSMicrophoneUsageDescription: Livestock uses the microphone so you can dictate into text fields. Speech stays on this device.
        NSSpeechRecognitionUsageDescription: Livestock converts speech to text on this device for text fields.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.livestock.ios
        PRODUCT_NAME: Livestock
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "ZYJVHJWT3P"
        SUPPORTS_MACCATALYST: NO
  RanchOSLivestockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: RanchOSLivestock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.livestock.dev.tests
        GENERATE_INFOPLIST_FILE: YES
