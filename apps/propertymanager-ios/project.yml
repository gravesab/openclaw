name: PropertyManager
options:
  bundleIdPrefix: ai.openclaw
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    DEVELOPMENT_TEAM: "ZYJVHJWT3P"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

schemes:
  PropertyManager:
    shared: true
    build:
      targets:
        PropertyManager: all
        PropertyManagerTests: [test]
    test:
      targets:
        - PropertyManagerTests

targets:
  PropertyManager:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: PropertyManager connects to your ranch PropertyManager API on the local network or Tailscale.
        NSMicrophoneUsageDescription: PropertyManager uses the microphone for voice meter entry.
        NSSpeechRecognitionUsageDescription: PropertyManager converts speech to meter readings.
        CFBundleURLTypes:
          - CFBundleURLName: ai.openclaw.propertymanager
            CFBundleURLSchemes:
              - $(APP_URL_SCHEME)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            100.85.36.72:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
              NSExceptionRequiresForwardSecrecy: false
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.propertymanager
        APP_DISPLAY_NAME: PropertyManager
        APP_URL_SCHEME: propertymanager
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "ZYJVHJWT3P"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.propertymanager.dev
          APP_DISPLAY_NAME: PropertyManager DEV
          APP_URL_SCHEME: propertymanager-dev
  PropertyManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PropertyManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.propertymanager.tests
        GENERATE_INFOPLIST_FILE: YES
