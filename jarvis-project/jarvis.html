<title>JARVIS · OpenClaw Ranch OS</title>
<script>
// Boot guard: runs before React/Babel so any startup failure renders on
// screen instead of leaving a blank page. No dependencies, no JSX.
(function () {
  var booted = false;
  var overlay = null;
  var banner = null;
  var bannerText = null;
  var bannerCount = 0;
  var errors = 0;
  var windowStart = 0;
  function mount() { return document.body || document.documentElement; }
  function detail(err) {
    if (err == null) return "Unknown error";
    if (err.stack) return String(err.stack).split("\n").slice(0, 7).join("\n");
    if (err.message) return String(err.message);
    return String(err);
  }
  function limited() {
    var now = Date.now();
    if (!windowStart || now - windowStart > 5000) { windowStart = now; errors = 0; }
    errors += 1;
    return errors > 8; // a throwing frame loop must not spam panels
  }
  function button(label, onClick) {
    var node = document.createElement("button");
    node.type = "button";
    node.textContent = label;
    node.style.cssText = "font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.25);color:#F2F5F3;border-radius:6px;padding:6px 14px;margin-right:8px;cursor:pointer;";
    node.onclick = onClick;
    return node;
  }
  function showOverlay(stage, err) {
    if (limited()) return;
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.id = "jarvis-boot-error";
      overlay.setAttribute("role", "alert");
      overlay.style.cssText = "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(10,15,13,0.97);font-family:'JetBrains Mono',monospace;padding:24px;";
      var box = document.createElement("div");
      box.style.cssText = "max-width:680px;width:100%;border:1px solid #E8B44F;border-radius:8px;padding:20px;";
      var title = document.createElement("div");
      title.style.cssText = "color:#E8B44F;font-size:12px;letter-spacing:2px;margin-bottom:10px;";
      var body = document.createElement("pre");
      body.style.cssText = "color:#F2F5F3;font-size:11px;white-space:pre-wrap;word-break:break-word;margin:0 0 14px 0;font-family:inherit;";
      var row = document.createElement("div");
      row.appendChild(button("Reload", function () { window.location.reload(); }));
      box.appendChild(title);
      box.appendChild(body);
      box.appendChild(row);
      overlay.appendChild(box);
      overlay._title = title;
      overlay._body = body;
      mount().appendChild(overlay);
    }
    overlay._title.textContent = "JARVIS FAILED TO START (" + stage + ")";
    overlay._body.textContent = detail(err);
  }
  function showBanner(kind, err) {
    if (limited()) return;
    if (!banner) {
      banner = document.createElement("div");
      banner.id = "jarvis-boot-banner";
      banner.setAttribute("role", "status");
      banner.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:9997;max-width:min(560px,90vw);background:rgba(8,12,18,0.94);border:1px solid #E8B44F;border-radius:6px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#F2F5F3;";
      bannerText = document.createElement("span");
      var dismiss = button("Dismiss", function () { banner.style.display = "none"; });
      dismiss.style.cssText += "padding:3px 10px;margin:0 0 0 10px;";
      banner.appendChild(bannerText);
      banner.appendChild(dismiss);
      mount().appendChild(banner);
    }
    bannerCount += 1;
    banner.style.display = "block";
    var line = detail(err).split("\n")[0];
    bannerText.textContent = (kind === "check" ? "Startup self-check failed (page still loaded): " : "Error: ") + line + (bannerCount > 1 ? " (x" + bannerCount + ")" : "");
  }
  window.__jarvisBootFail = function (stage, err) {
    if (booted) showBanner("error", err);
    else showOverlay(stage, err);
  };
  window.__jarvisShowCheckBanner = function (err) { showBanner("check", err); };
  window.__jarvisMarkBooted = function () { booted = true; };
  window.onerror = function (message, source, lineno, colno, err) {
    window.__jarvisBootFail("error", err || message || "Unknown error");
  };
  window.addEventListener("unhandledrejection", function (event) {
    window.__jarvisBootFail("promise", (event && event.reason) || "Unhandled rejection");
  });
  window.__jarvisGuardOk = true;
})();
</script>

<style>
  :root {
    --bg: #0A0F0D;
    --panel: rgba(255, 255, 255, 0.035);
    --panel-strong: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.09);
    --text: #F2F5F3;
    --muted: #B4BBB7;
    --dim: #848D89;
    --wood: #C4A77D;
    --blue: #00D4FF;
    --green: #3DDC84;
    --amber: #E8B44F;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root {
    height: 100%;
    height: 100dvh;
    max-height: 100dvh;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(1100px 500px at 50% -10%, rgba(0,212,255,0.07), transparent 60%),
                radial-gradient(900px 500px at 85% 110%, rgba(196,167,125,0.06), transparent 60%);
    pointer-events: none;
  }
  #root { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px; height: 56px; flex-shrink: 0;
    background: rgba(10, 15, 13, 0.82);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-family: var(--mono); font-weight: 600; font-size: 17px; letter-spacing: 3px; color: var(--text); }
  .logo span { color: var(--blue); }
  .logo.on {
    color: #f2fff7;
    padding: 5px 11px;
    border-radius: 8px;
    background: rgba(61,220,132,0.12);
    box-shadow: 0 0 0 1px rgba(61,220,132,0.7), 0 0 16px rgba(61,220,132,0.55), 0 0 36px rgba(0,212,255,0.28);
    text-shadow: 0 0 8px rgba(61,220,132,0.7);
    animation: logo-glow 2.2s ease-in-out infinite;
  }
  .logo.on span {
    color: var(--green);
    text-shadow: 0 0 10px rgba(61,220,132,1);
  }
  @keyframes logo-glow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(61,220,132,0.55), 0 0 12px rgba(61,220,132,0.4), 0 0 24px rgba(0,212,255,0.18); }
    50% { box-shadow: 0 0 0 1px rgba(61,220,132,1), 0 0 22px rgba(61,220,132,0.75), 0 0 48px rgba(0,212,255,0.4); }
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61,220,132,0.85); }
    70% { box-shadow: 0 0 0 10px rgba(61,220,132,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); }
  }
  .badge {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 5px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--muted); white-space: nowrap;
  }
  .badge.ranch { color: var(--wood); border-color: rgba(196,167,125,0.35); }
  .badge.data { color: var(--blue); border-color: rgba(0,212,255,0.35); }
  .badge.data.fixture { color: var(--amber); border-color: rgba(232,180,79,0.5); }
  .badge.build.dev { color: var(--amber); border-color: rgba(232,180,79,0.5); }
  .badge.build.prod { color: var(--green); border-color: rgba(61,220,132,0.45); }
  a.badge.dash { cursor: pointer; text-decoration: none; color: var(--muted); }
  a.badge.dash:hover { color: var(--text); border-color: rgba(196,167,125,0.5); }
  @media (pointer: coarse) {
    a.badge.dash { min-height: 44px; display: inline-flex; align-items: center; padding: 10px 12px; }
  }
  .topbar .spacer { flex: 1; }
  .clear-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  .clear-btn:hover { color: var(--text); border-color: rgba(196,167,125,0.45); }
  .clock { font-family: var(--mono); font-size: 12px; color: var(--dim); }

  /* ---------- Layout ---------- */
  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 260px; flex-shrink: 0; overflow-y: auto;
    border-right: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
    padding: 16px 14px; display: flex; flex-direction: column; gap: 20px;
  }
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .rail {
    width: 300px; flex-shrink: 0; overflow-y: auto;
    border-left: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
    padding: 16px 14px; display: flex; flex-direction: column; gap: 16px;
  }
  .section-title {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--dim); margin-bottom: 10px;
  }
  .glass {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    backdrop-filter: blur(10px);
  }

  /* ---------- Sidebar ---------- */
  .quick-btn {
    display: block; width: 100%; text-align: left;
    font-family: var(--sans); font-size: 12.5px; color: var(--text);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; margin-bottom: 6px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .quick-btn:hover { border-color: rgba(0,212,255,0.45); background: rgba(0,212,255,0.06); }
  .quick-btn .q { color: var(--blue); font-family: var(--mono); margin-right: 6px; }
  .brain-note { padding: 12px; font-size: 12px; line-height: 1.55; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  .brain-note form { display: flex; flex-direction: column; gap: 8px; }
  .brain-state { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--amber); }
  .brain-state.on {
    color: var(--green);
    text-shadow: 0 0 10px rgba(61,220,132,0.7);
  }
  .brain-cmd { display: block; margin-top: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--text); word-break: break-all; user-select: all; }
  .brain-dim { color: var(--dim); font-size: 11px; }
  .brain-error { color: var(--amber); }
  .brain-model { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
  .brain-model select {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--text);
    background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
  }
  .brain-model select:disabled { opacity: 0.5; }
  .brain-key {
    font-family: var(--mono); font-size: 12px; color: var(--text);
    background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px;
  }
  .brain-btn {
    align-self: flex-start; font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  .brain-btn:disabled { opacity: 0.4; cursor: default; }

  /* ---------- Chat ---------- */
  .chat-scroll { flex: 1; overflow-y: auto; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 11px 15px; border-radius: 12px; line-height: 1.55; font-size: 13.5px; }
  .msg.user {
    align-self: flex-end; background: rgba(0,212,255,0.12);
    border: 1px solid rgba(0,212,255,0.3); border-bottom-right-radius: 3px;
  }
  .msg.jarvis {
    align-self: flex-start; background: var(--panel-strong);
    border: 1px solid var(--border); border-bottom-left-radius: 3px;
  }
  .msg .who { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; margin-bottom: 6px; }
  .msg.user .who { color: var(--blue); }
  .msg.jarvis .who { color: var(--wood); }
  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  /* ---------- Composer ---------- */
  .composer { padding: 14px 26px 18px; border-top: 1px solid var(--border); background: rgba(10,15,13,0.7); }
  .composer form { display: flex; gap: 10px; }
  .composer input {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 15px; color: var(--text);
    font-family: var(--sans); font-size: 13.5px; outline: none;
  }
  .composer input:focus { border-color: rgba(0,212,255,0.5); }
  .composer input::placeholder { color: var(--dim); }
  .composer button {
    background: rgba(0,212,255,0.14); border: 1px solid rgba(0,212,255,0.4);
    color: var(--blue); border-radius: 10px; padding: 0 22px;
    font-family: var(--mono); font-size: 13px; cursor: pointer;
  }
  .composer button:hover { background: rgba(0,212,255,0.22); }
  .composer button:disabled { opacity: 0.4; cursor: default; }
  .composer button.listen.on {
    background: rgba(61,220,132,0.14);
    border-color: rgba(61,220,132,0.55);
    color: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  .composer button.voice.on {
    background: rgba(255,92,92,0.16);
    border-color: rgba(255,92,92,0.6);
    color: #ff8a8a;
  }
  .composer button.voice.muted { opacity: 0.65; }
  .composer button.wake.on {
    background: rgba(61,220,132,0.08);
    border-color: rgba(61,220,132,0.4);
    color: var(--green);
  }
  .composer button.wake.armed {
    background: rgba(61,220,132,0.18);
    border-color: rgba(61,220,132,0.7);
    color: var(--green);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .composer button.camera.on {
    background: rgba(232,180,79,0.16);
    border-color: rgba(232,180,79,0.55);
    color: var(--amber);
  }
  .version-build {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    color: var(--wood); margin-bottom: 2px;
  }
  .fixture-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
    color: var(--amber); border: 1px solid rgba(232,180,79,0.45);
    border-radius: 4px; padding: 2px 6px; white-space: nowrap;
  }
  .card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

  .center { position: relative; }
  .cam-preview {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; pointer-events: none; opacity: 0;
  }
  .cam-preview.on { opacity: 0.42; }
  .center { min-height: 0; }
  .room-stage { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
  .room-stage canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .room-tethers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .room-labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .room-label {
    position: absolute; transform: translate(-50%, -120%);
    font-family: var(--mono); font-size: 11px; color: var(--text);
    text-shadow: 0 1px 4px #000; white-space: nowrap;
  }
  .room-label .sub { display: block; color: var(--amber); font-size: 9px; letter-spacing: 1px; }
  .room-label.callout {
    transform: none; text-align: center; overflow: hidden; text-overflow: ellipsis;
    background: rgba(8,12,18,0.78); border: 1px solid; border-radius: 6px; padding: 2px 6px; box-sizing: border-box;
    font-size: 11px; line-height: 1.25;
  }
  .room-label.in-bubble {
    transform: translate(-50%, -50%);
    color: #0c1b33;
    font-weight: 650;
    letter-spacing: 0;
    line-height: 1.15;
    text-shadow: none;
    white-space: normal;
  }
  .room-label.in-bubble .bubble-copy { overflow: hidden; }
  .room-label.in-bubble .type { display: block; font-weight: 700; white-space: nowrap; }
  .room-label.in-bubble .task-name {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; font-weight: 650; line-height: 1.15;
  }
  .room-label .hover-card {
    position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
    width: 240px; padding: 8px 10px; text-align: left; color: #e7eef6;
    background: rgba(8, 14, 20, 0.94); border: 1px solid rgba(150, 190, 255, 0.45);
    border-radius: 8px; font-size: 12px; font-weight: 500; line-height: 1.4; z-index: 6;
  }
  .room-label .hover-card b { display: inline-block; min-width: 72px; color: #9eb6d4; font-weight: 600; }
  .room-label.in-bubble .sub { color: #1a3358; font-size: 0.72em; letter-spacing: 0; font-weight: 600; }
  .room-label.origin-mfr { color: #8ec5ff; }
  .room-label.origin-owner { color: #ffb15a; }
  .room-label.in-bubble.origin-mfr,
  .room-label.in-bubble.origin-owner { color: #0c1b33; }
  .room-hud {
    position: absolute; top: 10px; left: 12px; z-index: 3;
    display: flex; gap: 8px; align-items: center;
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--dim);
  }
  /* The hint never grows past two lines, so it clears the button row at top 40. Full text rides in title. */
  .room-hud .hint {
    line-height: 1.3; max-height: 2.6em; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .room-hud button, .rail .plate button, .rail .glass button {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.5px;
    background: rgba(10,15,13,0.72); border: 1px solid var(--border);
    color: var(--wood); border-radius: 6px; padding: 4px 8px; cursor: pointer;
  }
  .room-filters {
    position: absolute; top: 40px; left: 12px; z-index: 4;
    display: flex; flex-wrap: wrap; gap: 6px;
    max-width: calc(100% - 24px);
  }
  .room-filters button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.4px;
    background: rgba(10,15,13,0.86); border: 1px solid var(--border);
    color: var(--text); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .room-filters button.on.all { background: #d7e2ea; color: #101418; border-color: transparent; }
  .room-filters button.on.asset { background: #3878f5; color: #fff; border-color: transparent; }
  .room-filters button.on.livestock { background: #f5d12e; color: #1a1400; border-color: transparent; }
  .room-filters button.on.finance { background: #33c761; color: #04140a; border-color: transparent; }
  .room-filters button.callouts { margin-left: 10px; }
  .finance-legend {
    position: absolute; left: 12px; top: 74px; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px 12px;
    font-family: var(--mono); font-size: 10px; color: var(--text); pointer-events: none;
    background: rgba(8,12,18,0.7); border-radius: 6px; padding: 4px 8px;
  }
  .finance-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .finance-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .room-filters button.lasso.on { background: rgba(255,190,80,0.2); color: var(--amber); border-color: rgba(255,190,80,0.7); }
  .room-filters button.ungroup { color: #fff; border-color: rgba(255,255,255,0.7); border-style: dashed; }
  .room-filters button.reset-layout { color: var(--muted, #8a9a92); }
  .room-filters button.unpin:disabled,
  .room-filters button.pin:disabled { opacity: 0.4; cursor: default; }
  .room-filters button.callouts:not(.on) { color: var(--amber); border-color: rgba(232,180,79,0.55); }
  .room-label.callout.held { border-style: dashed; }
  .room-menu {
    position: absolute; z-index: 8; min-width: 188px; padding: 4px;
    background: rgba(10, 15, 13, 0.94); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .room-menu[hidden] { display: none; }
  .room-menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.2px;

  /* Voice visualizer: ambience only; never steals clicks or covers chat. */

  }
  .voice-viz .glow {
    position: absolute; width: min(54vw, 520px); height: min(54vw, 520px);

    filter: blur(28px);

  .voice-viz[data-state="speaking"] .glow {

      radial-gradient(circle at 50% 45%, rgba(61,220,132,0.55), transparent 58%),

  }
  .voice-viz[data-state="listening"] .glow {
    background:
      radial-gradient(circle at 50% 45%, rgba(0,212,255,0.5), transparent 58%),

  }
  .voice-viz .label {
    position: relative;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-indent: 0.42em;

  }
  .voice-viz[data-state="speaking"] .label { color: var(--green); }
  .voice-viz[data-state="listening"] .label { color: var(--blue); }
  @keyframes voice-glow {
    0%, 100% { transform: scale(0.92); opacity: 0.42; }
    50% { transform: scale(1.06); opacity: 0.7; }
  }
  .origin-mfr { color: #8ec5ff; }
  .origin-owner { color: #ffb15a; }
  .chat-dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
    background: rgba(10,15,13,0.86);
    border-top: 1px solid var(--border);

    max-height: 36%;
    overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .chat-dock .chat-scroll { flex: 1 1 auto; min-height: 0; max-height: 150px; }
  .chat-dock .composer { flex-shrink: 0; background: transparent; }
  .plate {
    overflow: auto;

  .plate .k { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .plate .v { color: var(--text); margin-bottom: 6px; }
  .plate .v.origin-mfr { color: #8ec5ff; }
  .plate .v.origin-owner { color: #ffb15a; }
  .plate .task { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

  /* ---------- Right rail ---------- */
  .sources { padding: 6px 0; }
  .sources .src-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--muted);
  }
  .sources .src-row:last-child { border-bottom: none; }
  .sources .src-row .n { color: var(--text); white-space: nowrap; }
  .sources .src-row.off .n { color: var(--amber); }
  .trace { padding: 12px; font-family: var(--mono); font-size: 11px; line-height: 1.7; }
  .trace .step { display: flex; gap: 8px; margin-bottom: 2px; }
  .trace .k { color: var(--dim); min-width: 52px; }
  .trace .intent { color: var(--wood); }
  .trace .tool { color: var(--blue); word-break: break-all; }
  .trace .src { color: var(--muted); }
  .trace .sql { color: var(--dim); word-break: break-all; margin-top: 6px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.12); }
  .trace .idle { color: var(--dim); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  @media (max-width: 1180px), (pointer: coarse) {
    .rail { width: 240px; }
    .composer { padding: 10px 12px 12px; }

    .composer input { min-width: 160px; flex: 1 1 180px; padding: 10px 12px; }
    .composer button { padding: 8px 12px; min-height: 36px; }

<body>
<div id="root"></div>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<!-- App source stays inert text until the boot script below transforms it with
     Babel inside try/catch, so a transform error renders on screen. -->
<script type="text/plain" id="jarvis-app-src">
const { useState, useEffect, useRef } = React;

// This copy is the DEV Jarvis page. A Production copy sets this to "prod".
const JARVIS_ENV = "dev";
const DASHBOARD_URL = "/";
const BUILD_LABEL = JARVIS_ENV === "prod" ? "PROD build" : "DEV build";
const VERSION_BUILD = JARVIS_ENV === "prod" ? "PROD Version Build" : "DEV Version Build";

const QUICK = [
  { label: "What's due next?", q: "what's due next?" },
  { label: "Overdue tasks", q: "what tasks are overdue?" },
  { label: "How many assets?", q: "how many assets do we have?" },
  { label: "Finance categories", q: "show the finance categories" },
];

const NOT_CONNECTED = "I can't answer that yet. My AI brain isn't connected, so I can only look up the assets, tasks, and finance totals loaded on this page.";

const STOP_WORDS = new Set(["the", "a", "an", "of", "on", "for", "to", "what", "whats", "is", "are", "how", "much", "many", "do", "does", "we", "have", "show", "me", "my", "about", "tell", "and", "in", "with", "has", "any", "there", "our", "did", "spent", "spend", "cost", "costs", "total", "task", "tasks", "asset", "assets", "due", "next", "overdue", "upcoming", "s", "it", "this", "that", "please", "jarvis", "can", "you", "give", "list", "find", "where", "when"]);

function queryWords(text) {
  return (String(text || "").toLowerCase().replace(/'/g, "").match(/[a-z0-9]+/g) || [])
    .map(word => {
      if (word.length > 4 && word.endsWith("ies")) return word.slice(0, -3) + "y";
      if (word.length > 3 && word.endsWith("s") && !word.endsWith("ss")) return word.slice(0, -1);
      return word;
    });
}

function nameScore(name, keys) {
  const tokens = queryWords(name).filter(word => word.length > 1);
  if (!tokens.length) return 0;
  const hits = tokens.filter(word => keys.indexOf(word) >= 0).length;
  return hits ? hits + hits / tokens.length : 0;
}

function bestMatch(items, keys, nameOf) {
  let best = null; let bestScore = 0;
  items.forEach(item => {
    const score = nameScore(nameOf(item), keys);
    if (score > bestScore) { bestScore = score; best = item; }
  });
  return best;
}

function sceneTasks(scene) {
  const list = [];
  scene.assets.forEach(asset => (asset.tasks || []).forEach((task, index) => {
    const due = Date.parse(task.nextDue || "");
    list.push({ asset, task, index, due: Number.isFinite(due) ? due : null, title: taskTitle(asset.name, task.name || task.item || "Task") });
  }));
  return list;
}

function sceneSource(scene) {
  if (!scene.assets.length) return scene.loading ? "Loading DEV data" : "DEV data unavailable";
  if (scene.generatedAt) return "Snapshot " + new Date(scene.generatedAt).toLocaleString("en-US", { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
  return "PropertyManager API (DEV)";
}

function taskLine(item) {
  return item.title + " on " + item.asset.name + ", due " + inServiceLabel(item.task.nextDue);
}

// Answers only from records already loaded on the page; anything else reports that the brain is not connected.
function answerFromScene(scene, query, today) {
  const text = String(query || "").toLowerCase();
  const keys = queryWords(text).filter(word => !STOP_WORDS.has(word));
  const finance = scene.finance || [];
  const asset = bestMatch(scene.assets, keys, item => item.name);
  const category = bestMatch(finance, keys, item => item.name);
  const asks = word => new RegExp("\\b" + word).test(text);
  const now = today == null ? Date.now() : today;

  if (asks("overdue") || asks("due") || asks("upcoming") || asks("next")) {
    const pool = sceneTasks(scene).filter(item => item.due != null && (!asset || item.asset === asset));
    const overdue = asks("overdue");
    const picked = pool.filter(item => overdue ? item.due < now : item.due >= now).sort((x, y) => x.due - y.due).slice(0, 3);
    const scope = asset ? " for " + asset.name : "";
    if (!picked.length) return { lookup: overdue ? "tasks overdue" : "tasks due next", text: overdue ? "Nothing is overdue" + scope + "." : "No upcoming due dates" + scope + ".", selection: asset ? { group: "asset", id: asset.id } : null, matched: asset ? asset.name : "", used: asset ? [asset.id] : [] };
    const first = picked[0];
    const head = overdue ? (pool.filter(item => item.due < now).length + " overdue" + scope + ". Oldest: ") : "Next due" + scope + ": ";
    return {
      lookup: overdue ? "tasks overdue" : "tasks due next",
      text: head + picked.map(taskLine).join("; ") + ".",
      selection: { group: "task", id: String(first.asset.id) + ":task:" + first.index },
      matched: first.title,
      used: picked.map(item => String(item.asset.id) + ":task:" + item.index),
    };
  }

  const financeWords = ["finance", "spend", "spent", "cost", "money", "transaction", "categor", "ledger", "expense", "purchase", "paid"];
  if (category || financeWords.some(asks)) {
    if (!finance.length) return { lookup: "finance", text: "No finance records are loaded on this page.", selection: null, matched: "", used: [] };
    if (category) {
      const count = (category.transactions || []).length;
      return {
        lookup: "finance category",
        text: category.name + ": net total " + financeTotalLabel(category.total) + " across " + count + (count === 1 ? " transaction." : " transactions."),
        selection: { group: "financeSummary", id: category.id + ":summary" },
        matched: category.name,
        used: [category.id + ":summary"],
      };
    }
    const total = finance.reduce((sum, item) => sum + (item.transactions || []).length, 0);
    const busiest = finance.slice().sort((x, y) => (y.transactions || []).length - (x.transactions || []).length)[0];
    return {
      lookup: "finance categories",
      text: "Finance has " + finance.length + " categories and " + total + " transactions: " + finance.map(item => item.name).join(", ") + ". The most transactions are in " + busiest.name + ".",
      selection: null,
      matched: "",
      used: [FINANCE_ALL_ID].concat(finance.map(item => item.id + ":summary")),
    };
  }

  if (asset) {
    if (asset.isPseudo) {
      const members = (scene.assets || []).filter(item => String(item.hostId || "") === String(asset.id));
      const count = members.length;
      const text = asset.name + " is a group with " + count + (count === 1 ? " asset." : " assets.");
      return {
        lookup: "asset",
        text,
        selection: { group: "asset", id: asset.id },
        matched: asset.name,
        used: [asset.id].concat(members.map(item => String(item.id))),
      };
    }
    const tasks = asset.tasks || [];
    const owner = tasks.filter(task => task.origin === "owner").length;
    const maker = tasks.filter(task => task.origin === "manufacturer").length;
    const parts = [asset.name + (asset.category ? ", " + asset.category : "") + "."];
    const build = [asset.manufacturer, asset.model].filter(Boolean).join(" ");
    if (build) parts.push(build + ".");
    parts.push("In service " + inServiceLabel(asset.placedInService) + ".");
    parts.push(tasks.length ? tasks.length + (tasks.length === 1 ? " task" : " tasks") + " (" + maker + " manufacturer, " + owner + " owner added)." : "No tasks recorded.");
    return { lookup: "asset", text: parts.join(" "), selection: { group: "asset", id: asset.id }, matched: asset.name, used: [asset.id].concat(tasks.map((_, index) => String(asset.id) + ":task:" + index)) };
  }

  const task = bestMatch(sceneTasks(scene), keys, item => item.title);
  if (task) {
    return {
      lookup: "task",
      text: task.title + " on " + task.asset.name + (task.task.frequency ? ", " + task.task.frequency : "") + (task.due != null ? ", due " + inServiceLabel(task.task.nextDue) : "") + ".",
      selection: { group: "task", id: String(task.asset.id) + ":task:" + task.index },
      matched: task.title,
      used: [String(task.asset.id) + ":task:" + task.index],
    };
  }

  const herds = scene.herds || [];
  const loose = scene.animals || [];
  const pets = scene.pets || [];
  const animals = herds.reduce((all, item) => all.concat(item.animals || []), []).concat(loose);
  const pet = bestMatch(pets, keys, item => item.name);
  const animal = bestMatch(animals, keys, item => item.tag);
  const herd = bestMatch(herds, keys, item => item.name);
  const livestockWords = ["livestock", "herd", "animal", "cattle", "cow", "goat", "pig", "chicken", "sheep", "pet", "dog", "cat"];
  const asksWord = word => new RegExp("\\b" + word + "s?\\b").test(text);
  if (pet || animal || herd || livestockWords.some(asksWord)) {
    const described = (kind, breed) => [kind, breed].filter(Boolean).join(", ");
    if (pet) {
      return { lookup: "pet", text: pet.name + (described(pet.kind, pet.breed) ? ": " + described(pet.kind, pet.breed) : "") + ". Status " + (pet.status || "unknown") + ".", selection: { group: "pet", id: pet.id }, matched: pet.name, used: [pet.id] };
    }
    if (animal) {
      return { lookup: "animal", text: animal.tag + (described(animal.species, animal.breed) ? ": " + described(animal.species, animal.breed) : "") + ". " + (animal.herdName ? "In herd " + animal.herdName : "Not in a herd") + ".", selection: { group: "animal", id: animal.id }, matched: animal.tag, used: [animal.id] };
    }
    if (herd) {
      const members = herd.animals || [];
      return { lookup: "herd", text: herd.name + " has " + members.length + (members.length === 1 ? " animal" : " animals") + (members.length ? ": " + members.map(item => item.tag).join(", ") : "") + ".", selection: { group: "herd", id: herd.id }, matched: herd.name, used: [herd.id].concat(members.map(item => item.id)) };
    }
    if (!animals.length && !pets.length) return { lookup: "livestock", text: "No livestock records are loaded on this page.", selection: null, matched: "", used: [] };
    if (pets.length && ["pet", "dog", "cat"].some(asksWord) && !["herd", "animal", "livestock"].some(asksWord)) {
      return { lookup: "pets", text: pets.length + (pets.length === 1 ? " pet: " : " pets: ") + pets.map(item => item.name + (described(item.kind, item.breed) ? " (" + described(item.kind, item.breed) + ")" : "")).join(", ") + ".", selection: { group: "herd", id: "livestock-pets" }, matched: "Pets", used: ["livestock-pets"].concat(pets.map(item => item.id)) };
    }
    const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
    const parts = [plural(animals.length, "animal") + " in " + plural(herds.length, "herd")];
    if (loose.length) parts.push(loose.length + " with no herd");
    if (pets.length) parts.push(plural(pets.length, "pet") + ": " + pets.map(item => item.name).join(", "));
    const groups = herds.map(item => item.id).concat(loose.length ? ["livestock-loose"] : [], pets.length ? ["livestock-pets"] : []);
    return { lookup: "livestock", text: "Livestock: " + parts.join("; ") + ".", selection: null, matched: "", used: ["livestock-all"].concat(groups) };
  }

  if (asks("how many") || asks("count")) {
    const tasks = sceneTasks(scene);
    const realAssets = scene.assets.filter(item => !item.isPseudo);
    const withTasks = realAssets.filter(item => (item.tasks || []).length).length;
    return {
      lookup: "counts",
      text: realAssets.length + " assets, " + withTasks + " with tasks, " + tasks.length + " tasks in all.",
      selection: null,
      matched: "",
      used: realAssets.map(item => item.id),
    };
  }

  return { lookup: "none", text: NOT_CONNECTED, selection: null, matched: "", used: [] };
}

/* ================= Brain: DEV OpenClaw gateway ================= */
const BRAIN_URL = JARVIS_ENV === "prod" ? "" : "ws://100.85.188.74:18789";
const BRAIN_SESSION = "agent:jarvis:jarvis-web";
const BRAIN_SCOPES = ["operator.read", "operator.write"];
const BRAIN_CLIENT = { id: "openclaw-control-ui", mode: "webchat", version: "jarvis-web", displayName: "Jarvis (RanchOS web)" };
const DEVICE_KEY = "jarvis-device-v1";
const DEVICE_TOKEN_KEY = "jarvis-device-token-v1";
const DEVICES_COMMAND = "ssh SSH-Dev docker exec openclawdev-openclaw-gateway-1 node dist/index.js devices ";

function b64url(bytes) {
  let binary = "";
  bytes.forEach(byte => { binary += String.fromCharCode(byte); });
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function loadDevice() {
  try {
    const saved = JSON.parse(localStorage.getItem(DEVICE_KEY) || "null");
    if (saved && saved.jwk && saved.publicKey && saved.deviceId) {
      const privateKey = await crypto.subtle.importKey("jwk", saved.jwk, { name: "Ed25519" }, false, ["sign"]);
      return { deviceId: saved.deviceId, publicKey: saved.publicKey, privateKey };
    }
  } catch (err) {}
  const pair = await crypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
  const raw = new Uint8Array(await crypto.subtle.exportKey("raw", pair.publicKey));
  const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", raw));
  const deviceId = Array.from(digest).map(byte => byte.toString(16).padStart(2, "0")).join("");
  const jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);
  localStorage.setItem(DEVICE_KEY, JSON.stringify({ deviceId, publicKey: b64url(raw), jwk }));
  return { deviceId, publicKey: b64url(raw), privateKey: pair.privateKey };
}

function storedDeviceToken() {
  try {
    const saved = JSON.parse(localStorage.getItem(DEVICE_TOKEN_KEY) || "null");
    return saved && typeof saved.token === "string" ? saved.token : "";
  } catch (err) { return ""; }
}

function brainMessageText(message) {
  if (!message) return "";
  if (typeof message === "string") return message;
  if (typeof message.text === "string") return message.text;
  if (Array.isArray(message.content)) return message.content.filter(part => part && part.type === "text").map(part => part.text || "").join("");
  return "";
}

function pairingRequestId(error) {
  const details = error && error.details;
  if (details && typeof details.requestId === "string") return details.requestId;
  const match = String((error && error.message) || "").match(/\(requestId:\s*([^\s)]+)\)/i);
  return match ? match[1] : "";
}

const MODEL_KEY = "jarvis-model";
function savedModel() {
  try { return localStorage.getItem(MODEL_KEY) || ""; } catch (err) { return ""; }
}
// Write scope can create a session with a model but not change an existing one, so each model gets its own session.
function modelSessionKey(ref) {
  if (!ref) return BRAIN_SESSION;
  return BRAIN_SESSION + "-" + ref.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

// Records the room can point at: the same ids objectsFromScene gives assets, herds, animals, pets, and categories.
function brainCandidates(scene) {
  const list = [];
  const add = (id, label) => { if (id && label) list.push({ id: String(id), label: String(label) }); };
  scene.assets.forEach(asset => { if (asset.id !== "no-asset") add(asset.id, asset.name); });
  scene.herds.forEach(herd => { add(herd.id, herd.name); (herd.animals || []).forEach(animal => add(animal.id, animal.tag)); });
  scene.animals.forEach(animal => add(animal.id, animal.tag));
  scene.pets.forEach(pet => add(pet.id, pet.name));
  scene.finance.forEach(category => add(category.id, category.name));
  return list;
}
const BRAIN_TRACE_LIMIT = 40;
// Tool results are the evidence: a record counts when its id or whole name appears in what a tool returned.
// With no tool results, fall back to records the reply names outright, and say so.
function brainTrace(scene, toolResults, reply) {
  const escape = value => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const named = (haystack, label) => label.length >= 3 && new RegExp("(^|[^a-z0-9])" + escape(label.toLowerCase()) + "($|[^a-z0-9])").test(haystack);
  const candidates = brainCandidates(scene);
  const pick = (haystack, byId) => {
    const ids = [];
    candidates.forEach(c => {
      if (ids.length >= BRAIN_TRACE_LIMIT || ids.indexOf(c.id) !== -1) return;
      if ((byId && c.id.length >= 8 && haystack.indexOf(c.id.toLowerCase()) !== -1) || named(haystack, c.label)) ids.push(c.id);
    });
    return ids;
  };
  if (toolResults.length) {
    let haystack = "";
    try { haystack = JSON.stringify(toolResults.map(tool => tool.result)).toLowerCase(); } catch (err) {}
    const names = Array.from(new Set(toolResults.map(tool => tool.name)));
    return { via: "tools", tools: names, ids: pick(haystack, true) };
  }
  return { via: reply ? "reply" : "none", tools: [], ids: reply ? pick(String(reply).toLowerCase(), false) : [] };
}

// The shared gateway key lives only in memory until pairing hands back a device token.
function createBrain(onStatus, onChat, onTool) {
  let ws = null;
  let sharedKey = "";
  let retry = null;
  let stopped = true;
  let sessionKey = BRAIN_SESSION;
  let connected = null;
  const pending = new Map();

  function status(next) {
    connected = next.kind === "connected" ? next : null;
    onStatus(next);
  }

  async function chooseModel(ref) {
    const key = modelSessionKey(ref);
    if (ref) {
      const found = await request("sessions.list", { search: key, limit: 5 });
      const exists = found && Array.isArray(found.sessions) && found.sessions.some(row => row.key === key);
      if (!exists) await request("sessions.create", { key, model: ref });
    }
    sessionKey = key;
    try { ref ? localStorage.setItem(MODEL_KEY, ref) : localStorage.removeItem(MODEL_KEY); } catch (err) {}
    if (connected) status({ ...connected, model: ref, modelError: "" });
  }

  function loadModels() {
    request("models.list", { view: "configured" }).then(result => {
      const models = (result && Array.isArray(result.models) ? result.models : [])
        .map(m => ({ ref: m.provider + "/" + m.id, name: m.name || m.id, reasoning: !!m.reasoning }))
        .sort((a, b) => a.name.localeCompare(b.name));
      if (connected) status({ ...connected, models });
      const want = savedModel();
      if (want && models.some(m => m.ref === want)) {
        chooseModel(want).catch(error => { if (connected) status({ ...connected, model: "", modelError: (error && error.message) || "Model switch failed." }); });
      } else if (want) {
        try { localStorage.removeItem(MODEL_KEY); } catch (err) {}
      }
    }).catch(() => {});
  }

  function request(method, params) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return Promise.reject(new Error("not connected"));
    const id = crypto.randomUUID();
    ws.send(JSON.stringify({ type: "req", id, method, params }));
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }

  async function sendConnect(socket, nonce) {
    const device = await loadDevice();
    const token = sharedKey || storedDeviceToken();
    const signedAt = Date.now();
    const payload = ["v2", device.deviceId, BRAIN_CLIENT.id, BRAIN_CLIENT.mode, "operator", BRAIN_SCOPES.join(","), String(signedAt), token, nonce].join("|");
    const signature = new Uint8Array(await crypto.subtle.sign({ name: "Ed25519" }, device.privateKey, new TextEncoder().encode(payload)));
    if (ws !== socket) return;
    const auth = sharedKey ? { token: sharedKey } : { token, deviceToken: token };
    request("connect", {
      minProtocol: 4, maxProtocol: 4,
      client: { id: BRAIN_CLIENT.id, displayName: BRAIN_CLIENT.displayName, version: BRAIN_CLIENT.version, platform: navigator.platform || "web", mode: BRAIN_CLIENT.mode },
      role: "operator", scopes: BRAIN_SCOPES, caps: ["tool-events"],
      device: { id: device.deviceId, publicKey: device.publicKey, signature: b64url(signature), signedAt, nonce },
      auth, userAgent: navigator.userAgent, locale: navigator.language,
    }).then(hello => {
      const issued = hello && hello.auth && hello.auth.deviceToken;
      if (issued) localStorage.setItem(DEVICE_TOKEN_KEY, JSON.stringify({ token: issued, scopes: hello.auth.scopes || [] }));
      sharedKey = "";
      sessionKey = BRAIN_SESSION;
      status({ kind: "connected", deviceId: device.deviceId, version: (hello && hello.server && hello.server.version) || "", models: [], model: "", modelError: "" });
      loadModels();
    }).catch(error => {
      const code = error && error.details && error.details.code;
      if (code === "PAIRING_REQUIRED") {
        status({ kind: "pairing", requestId: pairingRequestId(error), deviceId: device.deviceId });
        if (sharedKey) retry = setTimeout(open, 5000);
      } else if (code === "AUTH_DEVICE_TOKEN_MISMATCH") {
        localStorage.removeItem(DEVICE_TOKEN_KEY);
        status({ kind: "needs-key", note: "This browser's Jarvis credential was revoked. Enter the DEV gateway key to pair again." });
      } else {
        sharedKey = "";
        status({ kind: "error", note: (error && error.message) || "Connection failed." });
      }
      stopped = true;
      socket.close();
    });
  }

  function open() {
    clearTimeout(retry);
    if (!BRAIN_URL) { status({ kind: "error", note: "No brain is configured for this build." }); return; }
    if (!window.isSecureContext || !crypto.subtle) { status({ kind: "error", note: LOCALHOST_SENTENCE.replace("use the microphone", "connect the brain") }); return; }
    stopped = false;
    status({ kind: "connecting" });
    const socket = new WebSocket(BRAIN_URL);
    ws = socket;
    socket.onmessage = event => {
      let frame = null;
      try { frame = JSON.parse(String(event.data)); } catch (err) { return; }
      if (frame.type === "event" && frame.event === "connect.challenge") {
        const nonce = frame.payload && frame.payload.nonce;
        if (typeof nonce === "string") sendConnect(socket, nonce).catch(err => status({ kind: "error", note: "This browser can't sign the device key (" + (err && err.name) + ")." }));
        return;
      }
      if (frame.type === "event" && frame.event === "chat") {
        const data = frame.payload || {};
        if (data.sessionKey === sessionKey) onChat({ runId: data.runId, state: data.state, text: brainMessageText(data.message), error: data.errorMessage });
        return;
      }
      if (frame.type === "event" && frame.event === "agent") {
        const data = frame.payload || {};
        const tool = data.data || {};
        if (data.stream === "tool" && data.sessionKey === sessionKey && tool.phase === "result") {
          onTool({ runId: data.runId, name: String(tool.name || "tool"), result: tool.result, isError: !!tool.isError });
        }
        return;
      }
      if (frame.type === "res") {
        const waiter = pending.get(frame.id);
        if (!waiter) return;
        pending.delete(frame.id);
        if (frame.ok) waiter.resolve(frame.payload);
        else waiter.reject(frame.error || { message: "request failed" });
      }
    };
    socket.onclose = () => {
      if (ws !== socket) return;
      ws = null;
      pending.forEach(waiter => waiter.reject({ message: "disconnected" }));
      pending.clear();
      if (!stopped) {
        status({ kind: "connecting" });
        retry = setTimeout(open, 4000);
      }
    };
  }

  return {
    hasDeviceToken: () => !!storedDeviceToken(),
    connect(key) { sharedKey = String(key || "").trim(); open(); },
    resume() { if (storedDeviceToken()) open(); },
    send(text) {
      const runId = crypto.randomUUID();
      return request("chat.send", { sessionKey, message: text, deliver: false, idempotencyKey: runId }).then(() => runId);
    },
    useModel(ref) {
      return chooseModel(ref || "").catch(error => {
        if (connected) status({ ...connected, modelError: (error && error.message) || "Model switch failed." });
      });
    },
    stop() { stopped = true; sharedKey = ""; clearTimeout(retry); if (ws) ws.close(); ws = null; },
    forget() { this.stop(); localStorage.removeItem(DEVICE_TOKEN_KEY); status({ kind: "needs-key" }); },
  };
}

const NOVELTY_VOICES = ["Albert", "Bad News", "Bahh", "Bells", "Boing", "Bubbles", "Cellos", "Eddy", "Flo", "Fred", "Good News", "Grandma", "Grandpa", "Hysterical", "Jester", "Junior", "Pipe Organ", "Princess", "Rally", "Reed", "Rocko", "Sandy", "Shelley", "Superstar", "Trinoids", "Whisper", "Wobble", "Zarvox"];

const LOCALHOST_SENTENCE = "Open this page from http://127.0.0.1 on this Mac to use the microphone.";
const SAFARI_SENTENCE = "Listening needs Safari on this Mac.";
const DICTATION_SENTENCE = "Turn on Dictation in System Settings, then press Listen again.";

// Apple marks downloaded voices in the name ("Daniel (Enhanced)") or the voiceURI (com.apple.voice.premium...).
function voiceQuality(v) {
  const tag = ((v.name || "") + " " + (v.voiceURI || "")).toLowerCase();
  if (tag.indexOf("premium") !== -1) return 2;
  if (tag.indexOf("enhanced") !== -1) return 1;
  return 0;
}
function voiceBase(v) { return String(v.name || "").replace(/\s*\(.*\)\s*$/, ""); }
function voiceLang(v) { return String(v.lang || "").replace("_", "-"); }
function pickVoice(voices) {
  const english = voices.filter(v => voiceLang(v).indexOf("en-") === 0 && NOVELTY_VOICES.indexOf(voiceBase(v)) === -1);
  const best = list => list.slice().sort((a, b) => voiceQuality(b) - voiceQuality(a))[0] || null;
  const daniels = english.filter(v => voiceBase(v) === "Daniel" && voiceLang(v) === "en-GB");
  const daniel = best(daniels);
  if (daniel && voiceQuality(daniel)) return daniel;
  const better = best(english.filter(v => voiceQuality(v)).sort((a, b) => (voiceLang(b) === "en-GB") - (voiceLang(a) === "en-GB")));
  if (better) return better;
  if (daniel) return daniel;
  const alex = english.find(v => voiceBase(v) === "Alex" && voiceLang(v) === "en-US");
  return alex || english[0] || null;
}

let voicesReady = null;
function ensureVoices() {
  if (!("speechSynthesis" in window)) return Promise.resolve([]);
  if (voicesReady) return voicesReady;
  voicesReady = new Promise(resolve => {
    const have = speechSynthesis.getVoices();
    if (have && have.length) { resolve(have); return; }
    speechSynthesis.onvoiceschanged = () => resolve(speechSynthesis.getVoices() || []);
    setTimeout(() => resolve(speechSynthesis.getVoices() || []), 1500);
  });
  return voicesReady;
}

// Bumped on every stop so a reply still waiting on voices doesn't start talking afterward.
let speechTurn = 0;
const VOICE_OFF_KEY = "jarvis-voice-off";
function voiceMuted() {
  try { return localStorage.getItem(VOICE_OFF_KEY) === "1"; } catch (err) { return false; }
}
function setVoiceMuted(off) {
  try { off ? localStorage.setItem(VOICE_OFF_KEY, "1") : localStorage.removeItem(VOICE_OFF_KEY); } catch (err) {}
  if (off) stopSpeaking();
}
function stopSpeaking() {
  speechTurn++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  setRoomMode("idle");
}

const roomMode = { value: "idle" };
const roomModeListeners = [];
function setRoomMode(mode) {
  roomMode.value = mode;
  roomModeListeners.forEach(fn => fn(mode));
}
function onRoomMode(fn) {
  roomModeListeners.push(fn);
  return () => {
    const index = roomModeListeners.indexOf(fn);
    if (index >= 0) roomModeListeners.splice(index, 1);
  };
}

function speak(text) {
  if (!text || !("speechSynthesis" in window) || voiceMuted()) return;
  stopSpeaking();
  const turn = speechTurn;
  ensureVoices().then(voices => {
    const voice = pickVoice(voices);
    if (!voice || turn !== speechTurn) return;
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.lang = voice.lang;
    u.rate = 0.95;
    u.pitch = 1;
    u.volume = 1;
    u.onstart = () => setRoomMode("speaking");
    u.onend = () => setRoomMode("idle");
    u.onerror = () => setRoomMode("idle");
    speechSynthesis.speak(u);
  });
}

function isSafariOnMac() {
  const ua = navigator.userAgent || "";
  const vendor = navigator.vendor || "";
  return vendor.indexOf("Apple") !== -1 && /safari/i.test(ua) && !/chrome|chromium|crios|fxios/i.test(ua);
}

const WAKE_ARM_MS = 8000;
// Mic stays deaf this long after Jarvis stops talking so the speaker tail can't wake it.
const WAKE_ECHO_MS = 900;
// null: no wake word heard. "": wake word alone (arm and wait). Otherwise the command after the last "Jarvis".
function wakeCommand(transcript) {
  const text = String(transcript || "");
  const pattern = /\b(?:hey|okay|ok)?\s*jarvis\b[\s,.!?:;-]*/gi;
  let match, end = -1;
  while ((match = pattern.exec(text))) end = match.index + match[0].length;
  if (end < 0) return null;
  return text.slice(end).trim();
}

function mapAssets(rows) {
  if (!Array.isArray(rows)) return [];
  return rows.filter(row => row && row.name).map(row => ({
    id: row.id,
    name: String(row.name),
    category: row.category == null ? "" : String(row.category),
    location: row.location == null ? "" : String(row.location),
    manufacturer: row.manufacturer == null ? "" : String(row.manufacturer),
    model: row.model == null ? "" : String(row.model),
    placedInService: row.placed_in_service_date || row.placedInService || "",
    hostId: row.host_asset_id || row.hostId ? String(row.host_asset_id || row.hostId) : "",
    isPseudo: !!(row.is_pseudo || row.isPseudo),
    fixture: false,
    tasks: [],
  }));
}

function taskFromRow(row) {
  const task = { name: row.item == null ? "" : String(row.item) };
  if (row.area != null && row.area !== "") task.area = String(row.area);
  if (row.item != null && row.item !== "") task.item = String(row.item);
  if (row.category_name != null && row.category_name !== "") task.categoryName = String(row.category_name);
  if (row.priority != null && row.priority !== "") task.priority = String(row.priority);
  if (row.frequency != null && row.frequency !== "") task.frequency = String(row.frequency);
  if (row.next_due != null && row.next_due !== "") task.nextDue = String(row.next_due);
  if (row.origin === "manufacturer" || row.origin === "owner") task.origin = row.origin;
  return task;
}

function attachTasks(assets, taskRows) {
  const byAsset = {};
  if (Array.isArray(taskRows)) {
    taskRows.forEach(row => {
      if (!row || row.asset_id == null || row.asset_id === "") return;
      const key = String(row.asset_id);
      if (!byAsset[key]) byAsset[key] = [];
      byAsset[key].push(taskFromRow(row));
    });
  }
  return assets.map(asset => ({ ...asset, tasks: byAsset[String(asset.id)] || [] }));
}

function sceneFromReads(assetRows, taskRows) {
  const assets = attachTasks(mapAssets(assetRows), taskRows);
  if (!assets.length) return null;
  return { assets, herds: [], animals: [], pets: [], finance: [] };
}

function mapLivestock(rows) {
  const herds = [];
  const animals = [];
  const pets = [];
  if (!Array.isArray(rows)) return { herds, animals, pets };
  rows.forEach((row, index) => {
    if (!row) return;
    const species = String(row.species_code || row.species || "");
    if (species === "pet") {
      pets.push({
        id: row.id || "pet-" + index,
        name: String(row.name || row.tag || "Pet"),
        kind: String(row.kind || row.pet_kind || ""),
        breed: row.breed == null ? "" : String(row.breed),
        status: row.status == null ? "" : String(row.status),
        fixture: false,
      });
      return;
    }
    const animal = {
      id: row.id || "animal-" + index,
      tag: String(row.tag || row.name || "Animal"),
      species: String(row.species || row.species_code || ""),
      breed: row.breed == null ? "" : String(row.breed),
      status: row.status == null ? "" : String(row.status),
      herdName: row.herd_name == null ? "" : String(row.herd_name),
      fixture: false,
    };
    if (animal.herdName) {
      let herd = herds.find(item => item.name === animal.herdName);
      if (!herd) {
        herd = { id: "herd-" + animal.herdName, name: animal.herdName, fixture: false, animals: [] };
        herds.push(herd);
      }
      herd.animals.push(animal);
    } else {
      animals.push(animal);
    }
  });
  return { herds, animals, pets };
}

function shapesFor(scene, group) {
  const list = [];
  const show = name => group === "all" || group === name;
  if (show("asset")) scene.assets.forEach(asset => list.push({ group: "asset", id: asset.id, label: asset.name, fixture: asset.fixture, shape: "asset" }));
  if (show("herd")) scene.herds.forEach(herd => list.push({ group: "herd", id: herd.id, label: herd.name, fixture: herd.fixture, shape: "herd" }));
  if (show("animal")) scene.animals.forEach(animal => list.push({ group: "animal", id: animal.id, label: animal.tag, fixture: animal.fixture, shape: "animal" }));
  if (show("pet")) scene.pets.forEach(pet => list.push({ group: "pet", id: pet.id, label: pet.name, fixture: pet.fixture, shape: "pet" }));
  return list;
}

    if (!categories.length) return null;

  };
  const attached = {};
  data.assets.forEach(asset => {
    const host = hostOf(asset);
    if (host) (attached[host] = attached[host] || []).push(asset);
  });
  // Attachments sit in a row in front of their host, so the host family is one compact circle.
  // Spread across the field they made that circle huge, and separateFamilies shoved every other family away.
  function attachmentPlan(asset, reach) {
    const items = (attached[String(asset.id)] || []).slice()
      .sort((a, b) => (b.tasks || []).length - (a.tasks || []).length || String(a.name).localeCompare(String(b.name)))
      .map(item => {
        const count = (item.tasks || []).length;
        const radius = assetParentRadius(count);
        return { asset: item, radius, reach: familyReach(radius, TASK_R, count) };
      });
    if (!items.length) return { items, block: reach };
    const deepest = Math.max(...items.map(item => item.reach));
    // A pseudoasset is only a grouping, so its members ring it and it sits at their center.
    if (asset.isPseudo && items.length > 1) {
      const around = items.reduce((sum, item) => sum + item.reach * 2 + 1.0, 0);

      let turn = -Math.PI / 2;
      items.forEach(item => {
        const span = ((item.reach * 2 + 1.0) / around) * Math.PI * 2;
        item.dx = Math.cos(turn + span / 2) * ring;
        item.dz = Math.sin(turn + span / 2) * ring;
        turn += span;
      });
      const cx = items.reduce((sum, item) => sum + item.dx, 0) / items.length;
      const cz = items.reduce((sum, item) => sum + item.dz, 0) / items.length;
      items.forEach(item => { item.dx -= cx; item.dz -= cz; });
      return { items, block: Math.max(reach, ...items.map(item => Math.hypot(item.dx, item.dz) + item.reach)) };
    }
    const width = items.reduce((sum, item) => sum + item.reach * 2, 0) + 1.0 * (items.length - 1);

    items.forEach(item => {

      item.dz = dz;

  }
  const categories = [];
  data.assets.forEach(asset => {
    if (hostOf(asset)) return;
    const name = asset.category ? String(asset.category) : "Uncategorized";

    if (!cat) {
      cat = { name, assets: [] };
      categories.push(cat);
    }
    cat.assets.push(asset);
  });
  categories.sort((a, b) => b.assets.length - a.assets.length || a.name.localeCompare(b.name));
  let assetCursor = -8;
  let assetMaxX = -12;
  let assetCount = 0;
  categories.forEach(cat => {
    cat.assets.sort((a, b) => (b.tasks || []).length - (a.tasks || []).length || String(a.name).localeCompare(String(b.name)));
    // Rows are spaced by their own largest task ring so neighboring rows never reach into each other.
    const plans = new Map(cat.assets.map(asset => {
      const count = (asset.tasks || []).length;

      const reach = familyReach(radius, TASK_R, count);

    }));

        ? memberCount + (memberCount === 1 ? " asset" : " assets")
        : tasks.length + (tasks.length === 1 ? " task" : " tasks");

        id: String(asset.id), group: "asset", parentId, label: asset.name,
        placedInService: asset.placed_in_service_date || asset.placedInService || "",
        detail,

        color: hslColor(assetHue(assetIndex), 0.72, assetIndex % 2 ? 0.66 : 0.58), radius: assetRadius, home: assetHome, showLabel: true,
      });

      });
      const themeRank = theme => theme === OTHER_THEME ? TASK_THEMES.length : TASK_THEMES.indexOf(theme);

        id: String(asset.id) + ":task:" + taskIndex, group: "task", parentId: String(asset.id),
        label, fixture: !!asset.fixture, kind: "task", domain: "asset", theme: theme.id,
        origin: task.origin || "", area: task.area || "", priority: task.priority || "",
        frequency: task.frequency || "", nextDue: task.nextDue || "",
        color: taskColor(task.origin, theme),
        radius: TASK_R, home: taskHome, showLabel: false,

    };

      const assetHome = [edge + plan.block, 0, home[2]];
      edge += plan.block * 2 + 1.4;

      pushAsset(asset, assetHome, plan.radius, "");
      plan.items.forEach(item => {
        pushAsset(item.asset, [assetHome[0] + item.dx, 0, assetHome[2] + item.dz], item.radius, String(asset.id));

  const animalChild = animal => ({ id: animal.id, group: "animal", label: animal.tag, fixture: !!animal.fixture, kind: "animal" });
  const livestockGroups = data.herds.map(herd => ({
    id: herd.id, label: herd.name, fixture: !!herd.fixture, members: (herd.animals || []).map(animalChild),
  }));
  if (data.animals.length) {

  }

      id: "livestock-pets", label: "Pets", fixture: data.pets.every(pet => pet.fixture),
      members: data.pets.map(pet => ({ id: pet.id, group: "pet", label: pet.name, fixture: !!pet.fixture, kind: "pet" })),

  let livestockX = assetMaxX + 10;
  const livestockRow = [];
  livestockGroups
    .filter(group => group.members.length > 0)
    .sort((a, b) => b.members.length - a.members.length || String(a.label).localeCompare(String(b.label)))
    .forEach(group => {

      const reach = familyReach(radius, animalR, count);

      const parent = {
        id: group.id, group: "herd", label: group.label, detail: count + (count === 1 ? " animal" : " animals"),
        fixture: group.fixture, kind: "herd", domain: "livestock", color: herdColor, radius, home, parentId: "", showLabel: true,
      };

  }

    .filter(category => (category.transactions || []).length > 0)
    .sort((a, b) => (b.transactions || []).length - (a.transactions || []).length || String(a.name).localeCompare(String(b.name)));

      id: category.id, group: "finance", label: category.name,
      detail: transactions.length + (transactions.length === 1 ? " transaction" : " transactions"),
      fixture: !!category.fixture, kind: "finance", domain: "finance",

    };

    list.push({
      id: category.id + ":summary", group: "financeSummary", parentId: category.id,
      label: financeTotalLabel(category.total),
      detail: "Net total",
      fixture: !!category.fixture, kind: "financeSummary", domain: "finance",
      color: color === financeColor ? financeChild : shadeOf(color), radius: summaryR,
      home: [home[0], 0, home[2] + radius + summaryR + 1.4], showLabel: true,
    });
    return { obj: parent, reach: radius, count: transactions.length };
  });
  const countLabel = count => count + (count === 1 ? " transaction" : " transactions");
  const spending = rankedFinance.filter(category => !isTransferCategory(category));
  const transfers = rankedFinance.filter(isTransferCategory);
  const financeRow = layFinance(spending, 0);
  const financeCount = financeRow.reduce((sum, item) => sum + item.count, 0);
  pushRowRoot(list, financeRow, {
    id: FINANCE_ALL_ID, group: "finance", label: "All transactions",
    detail: financeTotalLabel(financeGrandTotal(spending)) + " · " + countLabel(financeCount),
    count: financeCount, fixture: financeRow.every(item => item.obj.fixture), domain: "finance", color: financeColor,
  });

  const transferCount = transfers.reduce((sum, category) => sum + (category.transactions || []).length, 0);
  const transfersZ = Math.ceil(spending.length / FINANCE_ROW) * financeRowGap + widestR + categoryParentRadius(transferCount) * 2 + 3;
  const transferRow = layFinance(transfers, transfersZ);
  pushRowRoot(list, transferRow, {
    id: FINANCE_TRANSFERS_ID, group: "finance", label: "Transfers",
    detail: financeTotalLabel(financeGrandTotal(transfers)) + " · " + countLabel(transferCount) + " · not in All transactions",
    count: transferCount, fixture: transferRow.every(item => item.obj.fixture), domain: "finance", color: FINANCE_TRANSFER_COLOR,
  });

    ...item, pos: item.home.slice(), yaw: 0, userScale: 1, dismissed: false,
  }));
  layoutBubbles(objects, null);
  objects.forEach(obj => {
    obj.radius = obj.drawRadius;
    obj.home[1] = obj.drawRadius;
    obj.pos[1] = obj.drawRadius;
  });
  return objects;
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const ROOM_FILTER_IDS = ["all", "asset", "livestock", "finance"];
function normalizeRoomFilter(value) {
  const raw = String(value || "").trim().toLowerCase();
  if (raw === "transactions") return "finance";
  if (raw === "assets") return "asset";
  return ROOM_FILTER_IDS.indexOf(raw) >= 0 ? raw : "";
}
function readRoomFilter() {
  try {
    const fromQuery = normalizeRoomFilter(new URLSearchParams(window.location.search).get("view"));
    if (fromQuery) return fromQuery;
  } catch (err) {}
  try {
    const stored = normalizeRoomFilter(localStorage.getItem("jarvis-room-filter"));
    if (stored) return stored;
  } catch (err) {}
  return "all";
}
function writeRoomFilter(id) {
  const next = normalizeRoomFilter(id) || "all";
  try { localStorage.setItem("jarvis-room-filter", next); } catch (err) {}
  try {
    const url = new URL(window.location.href);
    if (next === "all") url.searchParams.delete("view");
    else url.searchParams.set("view", next);
    if (url.href !== window.location.href) window.history.replaceState({}, "", url);
  } catch (err) {}
}
