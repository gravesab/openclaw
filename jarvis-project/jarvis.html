  if (answerFromScene(ranch, "list finance categories", today).lookup !== "finance categories") throw new Error("cat is not category");
  const petList = answerFromScene(ranch, "tell me about the pets", today);
  if (petList.text !== "1 pet: Rex (Dog)." || petList.selection.id !== "livestock-pets") throw new Error("pet list");
  const hosted = objectsFromScene({ ...probe, finance: [], assets: [
    { id: "h1", name: "Tractor", tasks: [{ name: "Oil" }, { name: "Grease" }] },
    { id: "a1", name: "Auger", hostId: "h1", tasks: [{ name: "Pin" }] },
    { id: "a2", name: "Rake", hostId: "a1", tasks: [] },
    { id: "s1", name: "Shed", tasks: [] },
  ] }).filter(obj => obj.group === "asset");
  const hostAt = id => hosted.find(obj => obj.id === id);
  if (hosted.length !== 4 || hostAt("a1").parentId !== "h1" || hostAt("a2").parentId !== "") throw new Error("hosted assets");
  if (Math.hypot(hostAt("a1").home[0] - hostAt("h1").home[0], hostAt("a1").home[2] - hostAt("h1").home[2]) > 6) throw new Error("attachment beside host");
  const hubbed = objectsFromScene({ ...probe, finance: [], assets: [
    { id: "g1", name: "Mowing", isPseudo: true, tasks: [] },
    { id: "m1", name: "Field Mower", hostId: "g1", tasks: [{ name: "Oil" }, { name: "Belt" }, { name: "Blade" }] },
    { id: "m2", name: "Push Mower", hostId: "g1", tasks: [] },
    { id: "m3", name: "Wheel Mower", hostId: "g1", tasks: [{ name: "Oil" }] },
  ] }).filter(obj => obj.group === "asset");
  const hub = hubbed.find(obj => obj.id === "g1"), rim = hubbed.filter(obj => obj.parentId === "g1");
  const mid = [0, 2].map(axis => rim.reduce((sum, obj) => sum + obj.home[axis], 0) / rim.length);
  if (rim.length !== 3 || Math.hypot(mid[0] - hub.home[0], mid[1] - hub.home[2]) > 0.01) throw new Error("pseudo centered");
  if (rim.some(obj => Math.hypot(obj.home[0] - hub.home[0], obj.home[2] - hub.home[2]) < hub.radius + obj.radius)) throw new Error("pseudo ring clear");
  const themeOf = title => taskTheme(title).id;
  if (themeOf("Check engine oil level") !== "oil" || themeOf("Inspect and replace primary air filter") !== "filters"
    || themeOf("Inspect winch cable") !== "inspect" || themeOf("Test safety interlock") !== "safety" || themeOf("Paint hood") !== "other") throw new Error("task themes");
  const sectored = objectsFromScene({ ...probe, finance: [], assets: [{ id: "t1", name: "Tractor", tasks: [
    { name: "Inspect hoses" }, { name: "Change oil" }, { name: "Grease fittings" }, { name: "Inspect belts" },
  ] }] }).filter(obj => obj.group === "task");
  if (sectored.map(obj => obj.id).sort().join() !== "t1:task:0,t1:task:1,t1:task:2,t1:task:3") throw new Error("task ids kept");
  if (sectored[0].theme !== "oil" || sectored[1].theme !== "oil") throw new Error("task themes adjacent");
  const toolTrace = brainTrace(probe, [{ name: "assets_list", result: { content: [{ type: "text", text: "Well Pump: check pressure" }] } }], "It needs a check.");
  if (toolTrace.via !== "tools" || toolTrace.ids.join() !== "p1" || toolTrace.tools.join() !== "assets_list") throw new Error("brain trace tools");
  const idTrace = brainTrace({ ...probe, assets: [{ id: "asset-1234abcd", name: "Barn", tasks: [] }] }, [{ name: "asset_get", result: { asset_id: "ASSET-1234ABCD" } }], "");
  if (idTrace.ids.join() !== "asset-1234abcd") throw new Error("brain trace id");
  const replyTrace = brainTrace(probe, [], "The Field Mower is next; groceries are fine.");
  if (replyTrace.via !== "reply" || replyTrace.ids.join() !== "m1") throw new Error("brain trace reply");
  if (modelSessionKey("") !== BRAIN_SESSION || modelSessionKey("ollama/qwen3.5:9b") !== "agent:jarvis:jarvis-web-ollama-qwen3-5-9b") throw new Error("model session key");
  const one = id => [{ asset_id: id, item: "Check" }];
  const many = Array.from({ length: 40 }, (_, n) => ({ asset_id: "big", item: "Task " + n }));
  const rows = sceneFromReads(
    [{ id: "s1", name: "S1", category: "Small" }, { id: "s2", name: "S2", category: "Small" }, { id: "s3", name: "S3", category: "Small" }, { id: "big", name: "Big", category: "Large" }],
    one("s1").concat(one("s2"), one("s3"), many)
  );
  const placed = objectsFromScene({ ...rows, finance: [] }).filter(obj => obj.domain === "asset" && obj.group !== "zone");
  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const a = placed[i], b = placed[j];
      if ((a.parentId || a.id) === (b.parentId || b.id)) continue;
      if (Math.hypot(a.home[0] - b.home[0], a.home[2] - b.home[2]) < a.radius + b.radius) throw new Error("family overlap");
    }
  }
  if (typeof BootErrorBoundary !== "function" || typeof BootErrorBoundary.getDerivedStateFromError !== "function") throw new Error("error boundary present");
  if (typeof window.__jarvisBootFail !== "function" || typeof window.__jarvisShowCheckBanner !== "function" || typeof window.__jarvisMarkBooted !== "function") throw new Error("boot overlay present");
}

function greeting(hour) {
  const part = hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening";
  return "Good " + part + ". I answer from the assets, tasks, and finance totals loaded on this page, and pass anything else to the DEV brain when it's connected.";
}

function VoiceVisualizer({ speaking, listening, connected }) {
  // Live mic wins if both ever overlap (Listen cancels speech first).
  const state = listening ? "listening" : speaking ? "speaking" : connected ? "connected" : "idle";
  const label = state === "listening" ? "LISTENING" : state === "speaking" ? "SPEAKING" : "";
  return (
    <div className="voice-viz" data-state={state} aria-hidden="true">
      <div className="glow" />
      {label ? <div className="label">{label}</div> : null}
    </div>
  );
}

/* ================= App ================= */
function App() {
  const [messages, setMessages] = useState([
    { id: 0, role: "jarvis", kind: "text", text: greeting(new Date().getHours()) },
  ]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [listening, setListening] = useState(false);
  const [cameraOn, setCameraOn] = useState(false);
  const [scene, setScene] = useState(EMPTY_SCENE);
  const [sceneOpen, setSceneOpen] = useState(true);
  const [sceneGroup, setSceneGroup] = useState("all");
  const [selection, setSelection] = useState(null);
  const [trace, setTrace] = useState(null);
  const [flow, setFlow] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const [muted, setMuted] = useState(voiceMuted());
  const [brain, setBrain] = useState({ kind: "needs-key" });
  const brainRef = useRef(null);
  const sceneRef = useRef(scene);
  sceneRef.current = scene;
  const brainStartRef = useRef(0);
  const [clock, setClock] = useState(now());
  const idRef = useRef(1);
  const chatRef = useRef(null);
  const recRef = useRef(null);
  const [wake, setWake] = useState(false);
  const [wakeArmed, setWakeArmed] = useState(false);
  const wakeRef = useRef({ on: false, armedUntil: 0, armTimer: 0, deafUntil: 0, rec: null, restart: 0 });
  const sendRef = useRef(null);
  const camRef = useRef(null);
  const camStreamRef = useRef(null);
  const restoreRef = useRef(null);

  function stopCamera() {
    const stream = camStreamRef.current;
    if (stream) stream.getTracks().forEach(track => track.stop());
    camStreamRef.current = null;
    if (camRef.current) camRef.current.srcObject = null;
    setCameraOn(false);
  }

  useEffect(() => {
    const onHide = () => stopCamera();
    window.addEventListener("pagehide", onHide);
    return () => {
      window.removeEventListener("pagehide", onHide);
      stopCamera();
    };
  }, []);

  useEffect(() => {
    let cancel = false;
    const unavailable = () => { if (!cancel) setScene({ ...EMPTY_SCENE, loading: false }); };
    let timer = 0;
    let shownAt = "";
    const readSnapshot = () => fetch("jarvis-live.json", { cache: "no-store" })
      .then(response => response.ok ? response.json() : Promise.reject(response.status))
      .then(data => (data && Array.isArray(data.assets) && data.assets.length) ? data : Promise.reject("empty"));
    // DEV rebuilds the snapshot every SNAPSHOT_MS; check just after each one is due, then every
    // SNAPSHOT_RETRY_MS until a newer one lands. Hidden tabs wait and check on return.
    const schedule = () => {
      clearTimeout(timer);
      if (cancel) return;
      const due = Date.parse(shownAt) + SNAPSHOT_MS + SNAPSHOT_GRACE_MS;
      timer = setTimeout(refresh, Number.isFinite(due) ? Math.max(SNAPSHOT_RETRY_MS / 2, due - Date.now()) : SNAPSHOT_RETRY_MS);
    };
    const refresh = () => {
      if (cancel || document.hidden) return;
      readSnapshot().then(data => {
        if (cancel) return;
        if (data.generatedAt && data.generatedAt !== shownAt) {
          shownAt = data.generatedAt;
          setScene(data);
          schedule();
        } else {
          clearTimeout(timer);
          timer = setTimeout(refresh, SNAPSHOT_RETRY_MS);
        }
      }).catch(() => { clearTimeout(timer); timer = setTimeout(refresh, SNAPSHOT_RETRY_MS); });
    };
    const onVisible = () => {
      if (document.hidden || !shownAt) return;
      if (Date.now() >= Date.parse(shownAt) + SNAPSHOT_MS + SNAPSHOT_GRACE_MS) refresh();
      else schedule();
    };
    document.addEventListener("visibilitychange", onVisible);
    readSnapshot().then(data => {
      if (cancel) return;
      shownAt = data.generatedAt || "";
      setScene(data);
      schedule();
    }).catch(() => {
      Promise.all([
        fetch(ASSET_URL).then(response => response.ok ? response.json() : Promise.reject(response.status)),
        fetch(TASK_URL).then(response => response.ok ? response.json() : Promise.reject(response.status)),
      ]).then(([assets, tasks]) => {
        const next = sceneFromReads(assets, tasks);
        if (!next) return unavailable();
        if (!cancel) setScene(next);
      }).catch(unavailable);
    });
    return () => { cancel = true; clearTimeout(timer); document.removeEventListener("visibilitychange", onVisible); };
  }, []);

  useEffect(() => {
    const c = setInterval(() => setClock(now()), 1000);
    return () => clearInterval(c);
  }, []);

  useEffect(() => {
    const off = onRoomMode(mode => setSpeaking(mode === "speaking"));
    const onKey = event => { if (event.key === "Escape" && roomMode.value === "speaking") stopSpeaking(); };
    window.addEventListener("keydown", onKey);
    return () => { off(); window.removeEventListener("keydown", onKey); };
  }, []);

  function voiceButton() {
    if (speaking) { stopSpeaking(); return; }
    setVoiceMuted(!muted);
    setMuted(!muted);
  }

  useEffect(() => {
    const replies = {};
    const tools = {};
    const onTool = event => {
      const runId = event.runId || "run";
      if (!event.isError) (tools[runId] = tools[runId] || []).push({ name: event.name, result: event.result });
    };
    const traceReply = (runId, text) => {
      const found = brainTrace(sceneRef.current, tools[runId] || [], text);
      delete tools[runId];
      const matched = found.via === "tools" ? found.tools.join(", ")
        : found.via === "reply" ? "no tools · named in reply" : "";
      const timeMs = Math.max(1, Math.round(performance.now() - brainStartRef.current));
      setTrace(prev => prev && prev.lookup === "brain" ? { ...prev, matched, used: found.ids.length, timeMs } : prev);
      setFlow({ ids: found.ids });
    };
    const onChat = event => {
      const runId = event.runId || "run";
      if (!replies[runId]) {
        replies[runId] = { id: idRef.current++, text: "" };
        setMessages(prev => [...prev, { id: replies[runId].id, role: "jarvis", kind: "text", text: "" }]);
      }
      const reply = replies[runId];
      if (event.state === "delta" && event.text) reply.text = event.text;
      if (event.state === "final" && event.text) reply.text = event.text;
      if (event.state === "error") reply.text = "The brain hit an error: " + (event.error || "unknown error") + ".";
      const text = reply.text || (event.state === "final" ? "(no reply)" : "");
      setMessages(prev => prev.map(m => m.id === reply.id ? { ...m, text } : m));
      if (event.state === "final" || event.state === "error" || event.state === "aborted") {
        setTyping(false);
        if (event.state === "final" && reply.text) speak(reply.text);
        if (event.state === "final") traceReply(runId, reply.text);
        else delete tools[runId];
        delete replies[runId];
      }
    };
    const client = createBrain(setBrain, onChat, onTool);
    brainRef.current = client;
    client.resume();
    return () => client.stop();
  }, []);

  useEffect(() => {
    const el = chatRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [messages, typing]);

  function say(text) {
    const id = idRef.current++;
    setMessages(prev => [...prev, { id, role: "jarvis", kind: "text", text }]);
  }

  function stopListen() {
    try { if (recRef.current) recRef.current.stop(); } catch (err) {}
    setListening(false);
  }

  function toggleCamera() {
    if (cameraOn) { stopCamera(); return; }
    if (!window.isSecureContext) { say(CAMERA_LOCALHOST); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say("No camera found.");
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(stream => {
      camStreamRef.current = stream;
      if (camRef.current) camRef.current.srcObject = stream;
      setCameraOn(true);
    }).catch(err => {
      const name = err && err.name;
      if (name === "NotAllowedError" || name === "PermissionDeniedError") say("Camera permission was denied.");
      else say("No camera found.");
    });
  }

  function micError(code) {
    if (code === "service-not-allowed") say(DICTATION_SENTENCE);
    else if (code === "not-allowed") say("Microphone permission was denied.");
    else if (code === "audio-capture") say("No microphone found.");
    else if (code === "network") say(SAFARI_SENTENCE);
  }

  function speechRecognizer() {
    if (!window.isSecureContext) { say(LOCALHOST_SENTENCE); return null; }
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!isSafariOnMac() || !Rec) { say(SAFARI_SENTENCE); return null; }
    return Rec;
  }

  function disarm() {
    const w = wakeRef.current;
    clearTimeout(w.armTimer);
    w.armedUntil = 0;
    setWakeArmed(false);
  }

  function stopWake() {
    const w = wakeRef.current;
    w.on = false;
    disarm();
    clearTimeout(w.restart);
    const rec = w.rec;
    w.rec = null;
    try { if (rec) rec.abort(); } catch (err) {}
    setWake(false);
    setWakeArmed(false);
  }

  function startWakeSession(Rec) {
    const w = wakeRef.current;
    if (!w.on || w.rec || document.hidden) return;
    const rec = new Rec();
    rec.lang = "en-US";
    rec.interimResults = true;
    rec.continuous = true;
    rec.onresult = (e) => {
      if (roomMode.value === "speaking" || Date.now() < w.deafUntil) return;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const heard = e.results[i][0].transcript;
        const command = wakeCommand(heard);
        const armed = Date.now() < w.armedUntil;
        if (!e.results[i].isFinal) {
          if (command) setInput(command);
          else if (armed && command === null) setInput(heard.trim());
          continue;
        }
        const ask = command || (armed && command === null ? heard.trim() : "");
        if (ask) {
          disarm();
          if (sendRef.current) sendRef.current(ask);
        } else if (command === "") {
          clearTimeout(w.armTimer);
          w.armedUntil = Date.now() + WAKE_ARM_MS;
          setWakeArmed(true);
          w.armTimer = setTimeout(disarm, WAKE_ARM_MS);
        }
      }
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return;
      micError(e.error);
      stopWake();
    };
    // Safari ends continuous sessions after silence; reopen while wake word is on.
    rec.onend = () => {
      if (w.rec === rec) w.rec = null;
      if (w.on) w.restart = setTimeout(() => startWakeSession(Rec), 300);
    };
    w.rec = rec;
    try { rec.start(); }
    catch (err) { w.rec = null; stopWake(); }
  }

  function toggleWake() {
    if (wakeRef.current.on) { stopWake(); return; }
    const Rec = speechRecognizer();
    if (!Rec) return;
    stopListen();
    wakeRef.current.on = true;
    setWake(true);
    startWakeSession(Rec);
  }

  useEffect(() => {
    let wasSpeaking = roomMode.value === "speaking";
    const off = onRoomMode(mode => {
      if (wasSpeaking && mode !== "speaking") wakeRef.current.deafUntil = Date.now() + WAKE_ECHO_MS;
      wasSpeaking = mode === "speaking";
    });
    const onVisible = () => {
      const w = wakeRef.current;
      if (!w.on) return;
      if (document.hidden) {
        const rec = w.rec;
        w.rec = null;
        try { if (rec) rec.abort(); } catch (err) {}
      } else {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Rec) startWakeSession(Rec);
      }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => { off(); document.removeEventListener("visibilitychange", onVisible); stopWake(); };
  }, []);

  function toggleListen() {
    if (listening) { stopListen(); return; }
    stopSpeaking();
    const Rec = speechRecognizer();
    if (!Rec) return;
    if (wakeRef.current.on) stopWake();
    const rec = new Rec();
    rec.lang = "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = (e) => {
      let interim = "", finalT = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalT += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (interim) setInput(interim);
      if (finalT.trim()) send(finalT);
    };
    rec.onerror = (e) => {
      setListening(false);
      micError(e.error);
    };
    rec.onend = () => { setListening(false); recRef.current = null; };
    recRef.current = rec;
    try { rec.start(); setListening(true); }
    catch (err) { setListening(false); }
  }

  function clearChat() {
    stopListen();
    stopSpeaking();
    setMessages([{ id: idRef.current++, role: "jarvis", kind: "text", text: greeting(new Date().getHours()) }]);
    setTrace(null);
    setInput("");
  }

  function send(text) {
    const query = (text !== undefined ? text : input).trim();
    if (!query || typing) return;
    stopSpeaking();
    const uid = idRef.current++;
    setMessages(prev => [...prev, { id: uid, role: "user", kind: "text", text: query }]);
    setInput("");
    const started = performance.now();
    const a = answerFromScene(scene, query);
    if (a.lookup === "none" && brain.kind === "connected" && brainRef.current) {
      setTyping(true);
      setSelection(null);
      const picked = (brain.models || []).find(m => m.ref === brain.model);
      brainStartRef.current = started;
      setFlow({ ids: [] });
      setTrace({ lookup: "brain", matched: "", source: "DEV OpenClaw gateway · " + (picked ? picked.name : "default model"), timeMs: Math.max(1, Math.round(performance.now() - started)) });
      brainRef.current.send(query).catch(error => {
        setTyping(false);
        say("The brain didn't take that: " + ((error && error.message) || "request failed") + ".");
      });
      return;
    }
    const timeMs = Math.max(1, Math.round(performance.now() - started));
    setMessages(prev => [...prev, { id: idRef.current++, role: "jarvis", kind: "text", text: a.text }]);
    setTrace({ lookup: a.lookup, matched: a.matched, source: sceneSource(scene), timeMs, used: a.used.length });
    setFlow({ ids: a.used });
    speak(a.text);
    if (!a.selection) { setSelection(null); return; }
    setSceneOpen(true);
    setSceneGroup("all");
    setSelection(a.selection);
  }

  sendRef.current = send;

  function quick(q) {
    setInput(q);
    setTimeout(() => send(q), 140);
  }

  return (
    <React.Fragment>
      <TopBar clock={clock} onClear={clearChat} source={sceneSource(scene)} connected={brain.kind === "connected"} />
      <div className="main">
        <Sidebar
          onQuick={quick}
          brain={brain}
          onConnect={key => brainRef.current && brainRef.current.connect(key)}
          onForget={() => brainRef.current && brainRef.current.forget()}
          onModel={ref => brainRef.current && brainRef.current.useModel(ref)}
          busy={typing}
        />
        <div className="center">
          <video ref={camRef} className={"cam-preview" + (cameraOn ? " on" : "")} autoPlay muted playsInline />
          <RoomView
            scene={scene}
            selection={selection}
            setSelection={setSelection}
            listening={listening || wakeArmed}
            connected={brain.kind === "connected"}
            restoreRef={restoreRef}
            flow={flow}
          />
          <VoiceVisualizer speaking={speaking} listening={listening || wakeArmed} connected={brain.kind === "connected"} />
          <div className="chat-dock">
            <div className="chat-scroll" ref={chatRef}>
              {messages.map(m => <ChatMsg key={m.id} m={m} />)}
              {typing && (
                <div className="msg jarvis">
                  <div className="who">JARVIS</div>
                  <span className="typing"><i /><i /><i /></span>
                </div>
              )}
            </div>
            <div className="composer">
              <form onSubmit={e => { e.preventDefault(); send(); }}>
                <input
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  placeholder="Ask JARVIS anything about the ranch..."
                />
                <button type="button" className={"camera" + (cameraOn ? " on" : "")} onClick={toggleCamera}>{cameraOn ? "Stop camera" : "Camera"}</button>
                <button type="button" onClick={() => { if (restoreRef.current) restoreRef.current(); }}>Records</button>
                <button
                  type="button"
                  className={"voice" + (speaking ? " on" : muted ? " muted" : "")}
                  onClick={voiceButton}
                  title={speaking ? "Stop speaking (Esc)" : muted ? "Turn Jarvis's voice back on" : "Turn off Jarvis's voice"}
                >{speaking ? "Stop voice" : muted ? "Unmute" : "Mute"}</button>
                <button type="button" className={"listen" + (listening ? " on" : "")} onClick={toggleListen}>{listening ? "Stop" : "Listen"}</button>
                <button
                  type="button"
                  className={"wake" + (wakeArmed ? " armed" : wake ? " on" : "")}
                  onClick={toggleWake}
                  aria-pressed={wake}
                  title={wake ? "Stop listening for \"Jarvis\"" : "Listen hands-free: say \"Jarvis, what's due next?\""}
                >{wakeArmed ? "Go ahead" : wake ? "Wake on" : "Wake word"}</button>
                <button type="submit" disabled={!input.trim() || typing}>Send</button>
              </form>
            </div>
          </div>
        </div>
        <RightRail scene={scene} trace={trace} selection={selection} onSelect={setSelection} />
      </div>
    </React.Fragment>
  );
}

class BootErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) { return { error: error }; }
  render() {
    if (!this.state.error) return this.props.children;
    var raw = this.state.error && (this.state.error.stack || this.state.error.message || String(this.state.error));
    var message = String(raw || "Unknown render error").split("\n").slice(0, 6).join("\n");
    var btn = { fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: 1, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.25)", color: "#F2F5F3", borderRadius: 6, padding: "6px 14px", marginRight: 8, cursor: "pointer" };
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 9998, display: "flex", alignItems: "center", justifyContent: "center", background: "#0A0F0D", fontFamily: "'JetBrains Mono', monospace", padding: 24 }}>
        <div style={{ maxWidth: 640, width: "100%", border: "1px solid #E8B44F", borderRadius: 8, padding: 20 }}>
          <div style={{ color: "#E8B44F", fontSize: 12, letterSpacing: 2, marginBottom: 10 }}>JARVIS RENDER ERROR</div>
          <pre style={{ color: "#F2F5F3", fontSize: 11, whiteSpace: "pre-wrap", wordBreak: "break-word", margin: "0 0 14px 0", fontFamily: "inherit" }}>{message}</pre>
          <button type="button" onClick={() => window.location.reload()} style={btn}>Reload</button>
          <button type="button" onClick={() => { try { localStorage.removeItem(LAYOUT_KEY); } catch (err) {} window.location.reload(); }} style={btn}>Reset layout &amp; reload</button>
        </div>
      </div>
    );
  }
}

var bootCheckError = null;
try { runSelfChecks(); } catch (err) { bootCheckError = err; }
if (bootCheckError && window.__jarvisShowCheckBanner) window.__jarvisShowCheckBanner(bootCheckError);
ReactDOM.createRoot(document.getElementById("root")).render(
  <BootErrorBoundary><App /></BootErrorBoundary>
);
if (window.__jarvisMarkBooted) window.__jarvisMarkBooted();
</script>
<script>
// Boot: transforms the inert app source above with the same presets the Babel
// auto-transform used (react classic + env), inside try/catch so a transform
// or CDN failure renders on screen instead of a blank page.
(function () {

    div.setAttribute("role", "alert");
    div.style.cssText = "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0A0F0D;color:#E8B44F;font-family:monospace;font-size:12px;padding:24px;text-align:center;";
    div.textContent = "Jarvis failed to start: " + ((err && (err.message || err)) || "unknown error");
    (document.body || document.documentElement).appendChild(div);
  }
  try {
    if (!window.React || !window.ReactDOM) throw new Error("React 18 failed to load from the CDN.");
    if (!window.Babel || typeof Babel.transform !== "function") throw new Error("Babel failed to load from the CDN.");
    var src = document.getElementById("jarvis-app-src").textContent;
    var out = Babel.transform(src, {
      filename: "jarvis-app.jsx",
      presets: [["react", { runtime: "classic" }], "env"],
      sourceMaps: "inline",
      sourceFileName: "jarvis-app.jsx",
    }).code;
    (0, eval)(out + "\n//# sourceURL=jarvis-app.jsx");
  } catch (err) {
    if (window.__jarvisBootFail) window.__jarvisBootFail("transform", err);
    else lastResort(err);
  }

</script>
