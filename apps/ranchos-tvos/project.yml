name: RanchOS

options:
  bundleIdPrefix: ai.openclaw
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    tvOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

schemes:
  RanchOSiOS:
    shared: true
    build:
      targets:
        RanchOSiOS: all
  RanchOSMac:
    shared: true
    build:
      targets:
        RanchOSMac: all
  RanchOSTV:
    shared: true
    build:
      targets:
        RanchOSTV: all
  RanchOSHubTests:
    shared: true
    build:
      targets:
        RanchOSHubTests: [test]
    test:
      targets:
        - RanchOSHubTests

targets:
  RanchOSiOS:
    type: application
    platform: iOS
    sources:
      - path: HubSources
    info:
      path: HubSources/RanchOSiOS-Info.plist
      properties:
        CFBundleDisplayName: RanchOS DEV
        NSMicrophoneUsageDescription: Jarvis transcribes a question on this device when you press Start listening.
        NSSpeechRecognitionUsageDescription: Jarvis creates an on-device speech draft for your review before sending.
        NSCameraUsageDescription: Jarvis shows a local camera preview when you start the camera. No video is recorded or uploaded.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.85.188.74:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionRequiresForwardSecrecy: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.dev
        PRODUCT_NAME: RanchOS
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  RanchOSMac:
    type: application
    platform: macOS
    sources:
      - path: HubSources
    info:
      path: HubSources/RanchOSMac-Info.plist
      properties:
        CFBundleDisplayName: RanchOS DEV
        NSMicrophoneUsageDescription: Jarvis transcribes a question on this device when you press Start listening.
        NSSpeechRecognitionUsageDescription: Jarvis creates an on-device speech draft for your review before sending.
        NSCameraUsageDescription: Jarvis shows a local camera preview when you start the camera. No video is recorded or uploaded.
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.85.188.74:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionRequiresForwardSecrecy: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.macos.dev
        PRODUCT_NAME: RanchOS
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
  RanchOSTV:
    type: application
    platform: tvOS
    sources:
      - path: HubSources
        excludes:
          - RanchOSLivestockBrowserView.swift
    info:
      path: HubSources/RanchOSTV-Info.plist
      properties:
        CFBundleDisplayName: RanchOS DEV
        NSLocalNetworkUsageDescription: RanchOS reaches the DEV PropertyManager relay on this home network.
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.85.188.74:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionRequiresForwardSecrecy: false
            andrew-m4-pro.local:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionRequiresForwardSecrecy: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.tv.dev
        PRODUCT_NAME: RanchOS
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: TVAppIcon
        TARGETED_DEVICE_FAMILY: "3"
        TVOS_DEPLOYMENT_TARGET: "18.0"
  RanchOSHubTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HubTests
      - path: HubSources/RanchOSHubModel.swift
      - path: HubSources/RanchOSLivestockConnection.swift
      - path: HubSources/RanchOSLivestockStore.swift
      - path: HubSources/RanchOSLivestockBrowserModel.swift
      - path: HubSources/RanchOSPropertyLiveStore.swift
      - path: HubSources/Jarvis/RanchVAAssetGraph.swift
      - path: HubSources/Jarvis/RanchVADEVQuery.swift
      - path: HubSources/Jarvis/RanchVAWeather.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.ranchos.hub.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
